site_name: 康复处方指南
site_url: https://etherealstarry.github.io/rehab-prescription-guide/
site_description: 基于循证医学的康复运动处方查询平台
repo_url: https://github.com/etherealstarry/rehab-prescription-guide

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.instant
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: indigo
    - scheme: slate
      primary: custom
      accent: green
  icon:
    logo: material/run

plugins:
  - search:
      lang: zh

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/javascripts/redflags.js
  - assets/javascripts/assessment.js
  - assets/javascripts/prescription.js
  - assets/javascripts/evidence.js
  - assets/javascripts/mode-toggle.js
  - assets/javascripts/drawer.js
  - assets/javascripts/stepper.js
