<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>康复评估 — 康复处方助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="assessment-container">
  <div class="assessment-header">
    <button class="assessment-back" id="btn-back">← 返回首页</button>
    <div class="assessment-title" id="assessment-title">康复评估</div>
    <div class="assessment-subtitle" id="assessment-subtitle">请回答以下问题，系统将自动生成康复处方</div>
  </div>

  <!-- 步骤指示器 -->
  <div class="step-indicator" id="step-indicator"></div>

  <!-- 步骤容器 -->
  <div id="step-content"></div>

  <!-- 按钮行 -->
  <div class="step-buttons" id="step-buttons" style="display:none;">
    <button class="step-btn step-btn-prev" id="btn-prev">← 上一步</button>
    <button class="step-btn step-btn-next" id="btn-next">下一步 →</button>
  </div>
</div>

<!-- 处方结果页（初始隐藏） -->
<div class="rx-prescription" id="prescription-view" style="display:none;">
  <div class="rx-prescription-header">
    <button class="rx-prescription-back" id="btn-back-to-assessment">← 重新评估</button>
    <div class="rx-prescription-title" id="rx-dianosis-title">您的康复处方</div>
    <div class="rx-prescription-subtitle" id="rx-prescription-subtitle">基于您的评估结果生成</div>
  </div>
  <div id="rx-prescription-content"></div>
</div>

<script src="js/redflags.js"></script>
<script src="js/assessment.js"></script>
</body>
</html>
